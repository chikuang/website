[params]
  subtitle= "Assistant Professor in Statistics"
  image = "image.png"
  publications_note = "* indicates students or postdocs."
  interests = """My research interests include, but are not limited to:

  1. Functional data analysis.
  2. Statistical machine learning and high-dimensional statistical inference.
  3. Dependence modeling.
  4. Optimal design of experiments.
  5. Large language model (LLM) alignment.
  6. Retrieval-augmented generation (RAG) with uncertainty quantification.

  Applications include 💊 drug discovery and development, 🧪 toxicology, 🧠 neuroscience, 🌌 cosmic ray studies, and 🏀 sports.
  """
  cv_name= "CV_YCK_Sep19_2026.pdf"
