[[params.introduction.paragraph]]
  text = """Hello/你好! I am an Assistant Professor in Statistics at [Georgia State University](https://www.gsu.edu/). I am also a faculty member of [Brains & Behavior](https://neuroscience.gsu.edu/brains-behavior/) in its [Neuroscience Institute](https://neuroscience.gsu.edu/) and affiliated with the [Center for Cosmic Ray Studies](https://cosmic.gsu.edu/).

  I was a postdoctoral scholar at
  [McGill University](https://www.mcgill.ca/) jointly with the [University of Waterloo](https://uwaterloo.ca), kindly sponsored by the [Canadian Statistical Sciences Institute](https://canssi.ca/) (CANSSI). I am also affiliated with [Mila - Quebec AI Institute](https://mila.quebec/en/directory/chi-kuang-yeh) and UW's [Health Data Science Lab](https://uwaterloo.ca/health-data-science-lab/).
  
  My office is: Room 1407, [25 Park Place](https://en.wikipedia.org/wiki/25_Park_Place).
  
  I currently serve as an associate editor of [Statistics and Computing](https://link.springer.com/journal/11222).
"""
show_interests = true

