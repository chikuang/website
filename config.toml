[[params.introduction.paragraph]]
  text = """**About me**: 
  Hello. I am currently a CANSSI distinguish postdoctoral fellow 
  at [University of Waterloo](https://uwaterloo.ca) & [McGill University](https://www.mcgill.ca/).
  
  I completed my Ph.D. at UWaterloo under the guidance of Professors 
  [Gregory Rice](https://uwaterloo.ca/statistics-and-actuarial-science/about/people/grice) 
  and [Joel A. Dubin](https://uwaterloo.ca/statistics-and-actuarial-science/people-profiles/joel-dubin).
  During this time, I was affiliated with the [Health Data Science Lab](https://uwaterloo.ca/health-data-science-lab/) and 
  also had privilege of working closely with Professor [Peijun Sang](https://uwaterloo.ca/scholar/psang).
  Prior to that, I obtained my BSc and MSc degrees from the [University of Victoria](https://www.uvic.ca/) 
  where I was fortunate to work with Professor [Julie Zhou](https://www.uvic.ca/science/math-statistics/people/home/faculty/zhou_julie.php).
  
  I was originally from Hsinchu and Taipei, Taiwan. 
  """

