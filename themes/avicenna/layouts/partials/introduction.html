<div class="introduction home-intro">
	{{- range $index, $key := .Site.Params.Introduction.paragraph -}}
	<div class="intro-block">
		{{ $.RenderString (dict "display" "block") $key.text }}
	</div>
	{{- end -}}
	<section class="research-interests" aria-labelledby="research-interests-title">
		<h2 class="section-category" id="research-interests-title">Research Interests</h2>
		{{ .RenderString (dict "display" "block") .Site.Params.interests }}
	</section>
</div>
