{{- with .Site.Params.Social -}}
<script>
  feather.replace()
</script>
{{- end -}}
<script>
  (function () {
    var dateEl = document.getElementById("last-modified-date");
    if (!dateEl) return;
    fetch("https://api.github.com/repos/chikuang/website/commits?per_page=1")
      .then(function (resp) { return resp.ok ? resp.json() : null; })
      .then(function (data) {
        if (!data || !data.length || !data[0].commit || !data[0].commit.committer) return;
        var iso = data[0].commit.committer.date;
        if (!iso) return;
        dateEl.textContent = iso.slice(0, 10);
      })
      .catch(function () {
        // Keep fallback date if GitHub API is unavailable.
      });
  })();
</script>
