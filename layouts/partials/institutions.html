{{ with .Site.Params.institutions }}
<section class="institutions" aria-label="Education and appointments">
  <ul class="institution-logos">
    {{- range . }}
    <li>
      <a class="institution-link" href="{{ .url }}" aria-label="{{ .name }}" title="{{ .name }}">
        <span class="institution-logo-frame">
          <img class="institution-logo{{ with .logo_dark }} institution-logo--light{{ end }}" src="{{ .logo | relURL }}" alt="" width="22" height="22" loading="lazy" decoding="async">
          {{- with .logo_dark }}
          <img class="institution-logo institution-logo--dark" src="{{ . | relURL }}" alt="" width="22" height="22" loading="lazy" decoding="async">
          {{- end }}
        </span>
      </a>
    </li>
    {{- end }}
  </ul>
</section>
{{ end }}
